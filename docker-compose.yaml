services:
  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z #lock 1 image
    container_name: minio
    command: server /data --console-address ":9001" 
    # command minio to serve as server, store object at /data, open web console at port 9001
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER} #saved in env
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_UPDATE: "off" #auto update off, lock minio version
    ports:
      - "9000:9000" #receive request from host at 9000, map it to port 9000 in container for s3 api
      - "9001:9001" #go to 9001 to request the web console, it will map to port 9001 in container
    volumes:
      - minio-data:/data #minio write data to /data and docker volume minio-data manages it
    healthcheck:
      test: ["CMD","silo","healthcheck","ready"] #run exec command: silo healthcheck ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s #enable container to start
    restart: unless-stopped
    networks:
      - lakehouse
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000 
      #declare its host: service minio and its alias: local
    command: ["mb", "--ignore-existing", "local/landing", "local/warehouse"]
       #make bucket, local: alias for host, ignore if bucket existed
    restart: "no"
    networks:
      - lakehouse
  postgres:
    image: postgis/postgis:17-3.7-alpine #intergrate postgis for openstreetmap
    container_name: postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      HOUSING_DB_PASSWORD: ${HOUSING_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql #postgres save data to its default location and volume pg-data manages it
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      #docker engine mount sql files in docker/postgres/initdb to container and postgres entrypoint detect and run them
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "unless-stopped"
    networks:
      - lakehouse
  #catalog: iceberg-REST
  iceberg-rest:
    pull_policy: build
    build:
      context:
        ./docker/catalog
    image: uusima-rent-prices/iceberg-rest:1.10.1
    container_name: iceberg-rest
    env_file: .env
    environment: 
      #connect to Postgres to store pointers
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog 
      #implement jdbc catalog type
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog 
      #jdbc connection URL to postgres
      CATALOG_JDBC_USER: iceberg 
      CATALOG_JDBC_PASSWORD: ${CATALOG_DB_PASSWORD}
      CATALOG_JDBC_SCHEMA__VERSION: V1
      #connect to minio to store metadata files
      CATALOG_WAREHOUSE: s3://warehouse/  #send s3 api req to warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO #s3fileio implement
      CATALOG_S3_ENDPOINT: http://minio:9000 #s3 api end point
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8181:8181"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: 
      - lakehouse
volumes:
  minio-data:
  pg-data:
networks:
  lakehouse:
    name: lakehouse